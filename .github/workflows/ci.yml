name: CI

# Runs on:
#   * every branch push and PR  -> lint, type check, tests
#   * any v*.*.* tag push       -> the same checks, then a PyPI release
#   * manual dispatch           -> checks only (useful to re-run without a commit)
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# One run per branch/tag; a new push supersedes the previous run for that ref.
# Tag runs are never cancelled: interrupting an upload mid-flight could leave a
# version partially published, and a PyPI version can never be re-uploaded.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

# Least privilege by default; jobs opt into more below.
permissions:
  contents: read

jobs:
  check:
    name: pytest / ruff / mypy (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        run: pytest -m "not integration" --cov=tranchepay --cov-report=term-missing

  build:
    name: Build sdist + wheel
    needs: check
    # Only a version tag releases. A merge to main runs the checks above and
    # stops here, so no commit can ship a release by accident.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches __version__
        run: |
          python - <<'PY'
          import ast
          import os
          import pathlib
          import sys

          source = pathlib.Path("src/tranchepay/__init__.py").read_text()
          version = None
          for node in ast.parse(source).body:
              if isinstance(node, ast.Assign) and any(
                  getattr(target, "id", None) == "__version__" for target in node.targets
              ):
                  version = ast.literal_eval(node.value)
                  break
          if version is None:
              sys.exit("could not find __version__ in src/tranchepay/__init__.py")

          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if tag != version:
              sys.exit(f"tag v{tag} does not match __version__ {version}")
          print(f"releasing tranchepay {version}")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Upload dist artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment` must match the trusted publisher's environment on PyPI
    # (leave it blank on PyPI to accept any environment).
    environment:
      name: pypi
      url: https://pypi.org/project/tranchepay/
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC) + attestations
      contents: read
    steps:
      - name: Download dist artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        # Pinned to the v1.14.2 commit; swap for `release/v1` to track updates.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # only this job may write to the repository
    steps:
      # Required: `gh release create` shells out to git for the tag/remote
      # context, so this job needs a checkout even though it only uploads
      # artefacts.
      - uses: actions/checkout@v4

      - name: Download dist artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it alone"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "tranchepay $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
